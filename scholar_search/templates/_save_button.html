{% load navigation %}
{% if user.is_authenticated %}<form method="post" action="{% url 'save_paper' paper.pk %}" class="inline-form">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="action" value="{% if paper.pk in saved_ids %}remove{% else %}save{% endif %}"><button class="action-button {% if paper.pk in saved_ids %}is-saved{% endif %}" aria-label="{% if paper.pk in saved_ids %}Remove from library{% else %}Save to library{% endif %}"><svg class="icon"><use href="#i-save"/></svg>{% if paper.pk in saved_ids %}Saved{% else %}Save{% endif %}</button></form>
{% else %}{% reader_url paper as paper_path %}<a class="action-button" href="{% url 'login' %}?next={{ paper_path|urlencode }}" aria-label="Log in to save this paper"><svg class="icon"><use href="#i-save"/></svg>Save</a>{% endif %}
